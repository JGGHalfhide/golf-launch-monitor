# Shot model configuration — every tunable for spin, contact quality and
# simulated lateral dispersion lives here. Loaded by shotmodel.config.load_config().
#
# Sign conventions (sim): horizontalLaunchAngle > 0 = starts RIGHT of target.
# spinAxis > 0 is assumed to curve the ball RIGHT (Trackman convention) — verify
# against the sim and flip `axis_sign` below if it curves left.

[player]
handicap = 18.0          # any value; interpolated between anchors, clamped outside them
handedness = "right"       # "right" or "left" — mirrors the personal bias below

[bias]
# Personal miss tendency, expressed PLAYER-RELATIVE: positive = fade direction
# (right for a right-hander, left for a left-hander). Negative = draw.
hla_deg = 0.5              # start-line bias
axis_deg = 2.0             # curvature bias

[dispersion]
k = 1.25                   # scale = 1 + k * (1 - q); poor contact widens the spread
rho = 0.3                  # correlation between HLA and axis draws (open face starts right AND curves right)
tail_prob = 0.10           # probability a shot is a "fat tail" shot
tail_mult = 2.0            # sd multiplier for tail shots
axis_sign = 1              # set to -1 if the sim curves positive spinAxis to the LEFT
# Base sds (degrees) at anchor clubs. Clubs not listed are interpolated by their
# position in the [clubs] list below (which is ordered longest → shortest).
# These are the values AT `reference_handicap`; tools/calibrate_dispersion.py suggests replacements.
reference_handicap = 14.0
scale_sd_by_handicap = true   # sd *= table_dispersion(handicap) / table_dispersion(reference_handicap)
# Calibrated 2026-11-07 with tools/calibrate_dispersion.py (realistic q, hcp 14, config carry_yd).
# Original starting values were driver [2.0, 8.0], 7-iron [1.5, 6.0], wedges [1.2, 4.0] (~2.4x too wide).
sd_anchors = { driver = [0.85, 3.41], "7-iron" = [0.58, 2.33], pw = [0.49, 1.62], gw = [0.48, 1.60], sw = [0.47, 1.57] }  # [sd_hla, sd_axis]

[quality]
# q = exp(-0.5 * (w_vla * z_v^2 + w_speed * z_s^2))
w_vla = 0.3
w_speed = 0.7
vla_spread_mult = 1.0      # z_v = (vla - vla_mid) / (vla_half_range * vla_spread_mult)
speed_spread_frac = 0.05   # z_s = (median - speed) / (speed_spread_frac * median); only speed BELOW median counts
speed_warmup_shots = 10    # speed term is skipped until a club has this many shots of history
speed_window = 30          # rolling window (most recent shots per club) for the median
history_path = "logs/speed_history.json"

[spin]
min_rpm = 1000
max_rpm = 12000            # deliberately above table maxima so "+" values can be exceeded
# Per-club sensitivity is `spin_pct_per_deg` in each club below:
# spin = spin_mid * (1 + spin_pct_per_deg/100 * (vla - vla_mid))

[calibration]
# Simple ballistic approximation used by tools/calibrate_dispersion.py:
#   lateral_yd = carry * sin(hla) + curve_factor * carry * sin(axis)
# curve_factor ≈ 0.55 matches the rule of thumb "1° of axis ≈ 2.5 yd curve on a 250 yd drive".
curve_factor = 0.55
q_low = 0.3                # the "poor contact" fixed-q scenario

# ---------------------------------------------------------------------------
# Baseline table. Each metric is four [low, high] ranges for brackets:
#   Tour/Scratch (anchor hcp 0), Low 1–9 (5), Mid 10–18 (14), High 19+ (24).
# Midpoints are linearly interpolated between anchors; half-ranges likewise.
# "+" upper ends (e.g. 3,800+) are entered as the stated number.
# Clubs MUST be listed longest → shortest (sd interpolation uses this order).
# `aliases` are matched case-insensitively with spaces/hyphens removed.
# `carry_yd` is only used by the calibration script (typical mid-handicap carry).
# ---------------------------------------------------------------------------
[anchors]
handicaps = [0, 5, 14, 24]

[clubs.driver]
