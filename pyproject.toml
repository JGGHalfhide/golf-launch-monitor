[project]
name = "golf-launch-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
spin = ["opengolfcoach"]
stream = ["pymobiledevice3>=11.50"]  # USB clip transfer from iPhone (tools/watch_and_send.py)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["relay", "vision", "shotmodel"]
